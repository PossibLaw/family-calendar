name: Sync family calendar

on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - "schedule.toml"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-calendar-sync
  queue: max

jobs:
  sync:
    # The public template never writes to a calendar. A family must explicitly
    # enable this variable in its own private repository.
    if: ${{ vars.ENABLE_CALENDAR_SYNC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Sync only the trusted batch changed by this push
        if: ${{ github.event_name == 'push' }}
        run: python -m family_schedule sync --changed-since "$BEFORE"
        env:
          BEFORE: ${{ github.event.before }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      - name: Manually reconcile every repository source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m family_schedule sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
